[project]
name = "freelances-web-search"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Thiago Dantas", email = "Thiagodanttas32@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "loguru>=0.7.3",
    "mypy>=2.4.0",
    "pydantic>=2.13.5",
    "pytest-playwright>=0.9.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
freelances-web-search = "freelances_web_search:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]
